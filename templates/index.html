<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI English Conversation Practice</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>AI English Conversation Practice</h1>

    <label for="criteria">Enter Exam Criteria (e.g., IELTS, TOEFL):</label>
    <input type="text" id="criteria" placeholder="Enter Exam Criteria" />
    
    <button onclick="startConversation()">Start Conversation</button>
    <div id="conversationArea" style="display:none;">
        <h2>Current Question:</h2>
        <p id="currentQuestion"></p>
        <!-- <audio id="questionAudio" controls></audio> -->
        <button onclick="startRecording()">Start Speaking</button>
        <button onclick="getFeedback()">Get Feedback</button>
        <h3>Feedback:</h3>
        <p id="feedback"></p>
        <button onclick="nextQuestion()">Next Question</button>
    </div>

    <script>
        let questions = [];
        let currentQuestionIndex = 0; 
        let userCriteria = "";
        let prevFeedback = "";

        async function startConversation() {
            criteria = document.getElementById('criteria').value;

            if (!criteria) {
                alert('Please enter exam criteria!');
                return;
            }

            const response = await axios.post('/start_conversation', {
                sample_questions_path: '/Users/duynguyen/ai-for-non-native-english-speaking-feedback/data/ietls_speaking_questions.txt',
                model: 'gpt-4o-mini'
            });
            questions = response.data.questions;
            currentQuestionIndex = 0;
            document.getElementById('currentQuestion').textContent = questions[currentQuestionIndex]
            document.getElementById('conversationArea').style.display = 'block';
            nextQuestion();
        }

        async function nextQuestion() {
            document.getElementById('feedback').innerHTML = "";
            if (currentQuestionIndex < questions.length) {
                document.getElementById('currentQuestion').textContent = questions[currentQuestionIndex]
                const response = await axios.post('/next_question', {
                    question: questions[currentQuestionIndex],
                    criteria: criteria,
                });
                
                // document.getElementById('questionAudio').src = response.data.audio_url;
            currentQuestionIndex++;
            } else {
                alert('Conversation finished!');
            }
        }

        let mediaRecorder;
        let user_audio;
        let audioChunks = [];

        async function startRecording() {
            // const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            // mediaRecorder = new MediaRecorder(stream);
            // mediaRecorder.ondataavailable = event => {
            //     audioChunks.push(event.data);
            // };
            // mediaRecorder.start();

            const response = await axios.post('/record_users')
            user_audio = response.data.result;
        }

        async function getFeedback() {
            const response = await axios.post('/assess_pronunciation', {
                prev_feedback: prevFeedback,
                user_audio: user_audio,
                vectorstore_path: '/Users/duynguyen/ai-for-non-native-english-speaking-feedback/db_faiss'
            });
            document.getElementById('feedback').innerHTML = response.data.feedback;
            // document.getElementById('feedback').innerHTML = response.data.feedback;
            prevFeedback = response.data.feedback;
            audioChunks = [];
        }
    </script>
</body>
</html>
